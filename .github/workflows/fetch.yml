name: Fetch

# 2時間おきに取得する(JST の奇数時15分。19:15 は 20:00 の毎日の報告の直前にあたる)。
# Graph API の上限は1時間200回なので、1回150回までなら2時間おきでも収まる。
# 新着は1人1日1回だけ見て(fetch.py の LATEST_EVERY)、残りの回数は過去分の遡りに使う。
# 過去分の遡りが全員終わったら、1日4回('15 0,6,10,18 * * *')に戻してよい。
on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      max_calls:
        description: Graph API の呼び出し上限(1時間200回まで)
        default: "150"

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          CRAWL_API: ${{ vars.CRAWL_API }}
          CRAWL_TOKEN: ${{ secrets.CRAWL_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MAX_CALLS: ${{ inputs.max_calls || '150' }}
        run: python crawler/fetch.py
