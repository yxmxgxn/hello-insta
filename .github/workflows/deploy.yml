name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["crawler/**", "README.md"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # テーブルは IF NOT EXISTS なので毎回流して問題ない
      - name: Apply D1 schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --file schema.sql

      # 既存テーブルへの列追加。2回目以降は「列がある」で失敗するのでエラーは無視する
      - name: Add column post.added_at
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE post ADD COLUMN added_at TEXT"

      - name: Add column post.like_count
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE post ADD COLUMN like_count INTEGER"

      - name: Add column post.comments_count
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE post ADD COLUMN comments_count INTEGER"

      - name: Add column account.ig_count
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE account ADD COLUMN ig_count INTEGER"

      - name: Add column account.ig_count_at
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE account ADD COLUMN ig_count_at TEXT"

      - name: Add column post.product_type
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE post ADD COLUMN product_type TEXT"

      - name: Add column post.cap_hash
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE post ADD COLUMN cap_hash TEXT"

      - name: Add column fetch_state.latest_at
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE fetch_state ADD COLUMN latest_at TEXT"

      - name: Add column post.seen_at
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE post ADD COLUMN seen_at TEXT"

      - name: Add column post.keep
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE post ADD COLUMN keep INTEGER"

      - name: Add column fetch_state.round_after
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE fetch_state ADD COLUMN round_after TEXT"

      - name: Add column fetch_state.round_start
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE fetch_state ADD COLUMN round_start TEXT"

      - name: Add column fetch_state.round_at
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE fetch_state ADD COLUMN round_at TEXT"

      # クローラ用APIの合言葉(CRAWL_TOKEN)は GitHub の Secret から Worker の Secret へ流し込む(デプロイの最後の手順)
      - name: Add column account.groups
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE account ADD COLUMN groups TEXT"

      - name: Add column post.source
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE post ADD COLUMN source TEXT"

      # 公式APIの投稿(id が web: で始まらないもの)は、経路が分かっているので「api」にそろえる(値がないものだけ書くので、2回目以降は何も変わらない)
      - name: Fill post.source for official API posts
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "UPDATE post SET source = 'api' WHERE source IS NULL AND id NOT LIKE 'web:%'"

      - name: Add column post.caption
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "ALTER TABLE post ADD COLUMN caption TEXT"

      # いいね数・コメント数は取らないことにしたので、前に入った値を消す(値があるときだけ書くので、2回目以降は何も変わらない)
      - name: Clear like/comment counts
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute hello-insta --remote --command "UPDATE post SET like_count = NULL, comments_count = NULL WHERE like_count IS NOT NULL OR comments_count IS NOT NULL"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
          secrets: |
            CRAWL_TOKEN
        env:
          CRAWL_TOKEN: ${{ secrets.CRAWL_TOKEN }}
