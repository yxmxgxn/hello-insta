<meta property="og:url" content="https://insta.karin-archive.com/">

<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">

<body>
<header class="site-head">
  <h1><a href="/">ハロプロ インスタ検索</a></h1>
  <p class="lead">ハロー！プロジェクトのメンバーとOGのインスタを、日付と本文から探せます。</p>
  <p class="lead sec"><a href="/day">日付で見る</a> ｜ <a href="/about">このサイトについて</a> ｜ <a href="/tech">仕組み</a></p>
</header>

<main>
  <form id="f" class="search" role="search" autocomplete="off">
    <div class="q-row">
      <input id="q" type="search" placeholder="空白で新着 スペースと-で区切る 例: 音楽 -CD" aria-label="検索語" enterkeyhint="search">
      <button type="submit">検索</button>
    </div>

    <!-- 取得不可の人も並ぶので、検索結果の抜粋には使わせない(ページ全体は noindex にしない) -->
    <!-- 選んでいる人は見えない select に持つ(URL・検索の条件はここから作る) -->
    <select id="acc" multiple hidden aria-hidden="true"></select>
    <div class="opts">
      <button id="pick-open" class="pick-open" type="button" aria-expanded="false" aria-controls="panel"><span id="pick-label">メンバー選択</span></button>
      <label class="chk"><input id="act" type="checkbox">ハロプロ現役のみ</label>
      <label>並び
        <select id="order" name="order">
          <option value="">新しい順</option>
          <option value="old">古い順</option>
        </select>
      </label>
      <button type="button" class="ghost" id="reset">すべてリセット</button>
    </div>
    <div class="opts dates">
      <input type="hidden" id="from"><input type="hidden" id="to">
      <span class="dfield">いつから <span class="dsel" data-for="from" role="group" aria-label="いつから"><select class="y" aria-label="年"></select><select class="m" aria-label="月"></select></span></span>
      <span class="dfield">いつまで <span class="dsel" data-for="to" role="group" aria-label="いつまで"><select class="y" aria-label="年"></select><select class="m" aria-label="月"></select></span></span>
      <button type="button" class="ghost" id="reset-date">日付をリセット</button>
    </div>
    <div id="picked" class="picked" hidden data-nosnippet></div>
    <!-- メンバー選択のパネル。グループを押すとそのグループのアカウントがボタンで並ぶ -->
    <div id="panel" class="panel" hidden>
      <div id="gbtn" class="gbtn" role="group" aria-label="グループ" data-nosnippet></div>
      <div id="gaccs" class="gaccs" role="group" aria-label="アカウント" hidden data-nosnippet></div>
      <select id="other" class="other" aria-label="その他のアカウント" data-nosnippet><option value="">その他のアカウント</option></select>
      <div class="panel-h"><button type="button" class="ghost" id="pick-close">閉じる</button></div>
    </div>
  </form>

  <section class="cal" id="cal" aria-label="投稿カレンダー" hidden>
    <div id="years" class="years"></div>
    <div class="cal-head">
      <button type="button" class="ghost" id="prev" aria-label="前の投稿がある月">‹</button>
      <strong id="cal-title"></strong>
      <button type="button" class="ghost" id="next" aria-label="次の投稿がある月">›</button>
      <button type="button" class="ghost latest" id="latest" aria-label="一番新しい投稿がある月へ">最新</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </section>

  <p id="status" class="status" aria-live="polite"></p>
  <ul id="list" class="list"></ul>
  <button type="button" id="more" class="more" hidden>さらに古い投稿</button>
</main>

<footer class="site-foot">
  <p id="stats"></p>

</footer>

</body>
</html>
