<meta property="og:title" content="日付で見る - ハロプロ インスタ 検索">
<meta property="og:description" content="日付を選ぶと、その日にハロー！プロジェクトのメンバーとOGが投稿したインスタが時刻の順に並びます。グループで絞り込めて、過去の日もさかのぼれます。">
<meta property="og:type" content="website">
<link rel="canonical" href="https://insta.karin-archive.com/day">
<meta property="og:url" content="https://insta.karin-archive.com/day">
<meta property="og:site_name" content="ハロプロ インスタ 検索">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site-head wide">
  <h1><a href="/">ハロプロ インスタ 検索</a></h1>
  <p class="lead">日付を選ぶと、その日にハロプロのメンバーとOGが投稿したインスタが、時刻の順に並びます。グループで絞り込めます。</p>
  <p class="lead sec">日付と時刻は日本時間です。</p>
  <p class="lead sec"><a href="/">本文から探す</a> ｜ <a href="/about">このサイトについて</a></p>
</header>

<main class="wide">
  <form id="dayform" class="daybar" autocomplete="off">
    <button id="prev" type="button" class="ghost" aria-label="前の日">◀</button>
    <input id="date" type="date" aria-label="日付">
    <button id="next" type="button" class="ghost" aria-label="次の日">▶</button>
    <button id="today" type="button" class="ghost">今日</button>
  </form>

  <div class="daygrid">
    <nav id="gnav" class="gnav" aria-label="グループで絞る"></nav>
    <section>
      <p id="status" class="status" aria-live="polite"></p>
      <ol id="results" class="results"></ol>
    </section>
  </div>
</main>

<footer class="site-foot wide">
  <p><a href="/">本文から探す</a> ｜ <a href="/about">このサイトについて</a> ｜ <a href="/tech">仕組み</a></p>
  <p>画像・動画はこのサイトには保存していません。投稿は Instagram の公式の埋め込みか、Instagram でご覧ください。</p>
</footer>

<script src="/embed.js"></script>
<script src="/day.js"></script>
</body>
</html>
